name: 自建 Debug APK

on:
  workflow_dispatch:
    inputs:
      build_metadata:
        description: "版本名附加标记（留空则不带）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: custom-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Debug
        env:
          META: ${{ inputs.build_metadata }}
        run: |
          metadata_arg=()
          if [[ -n "$META" ]]; then
            metadata_arg=("-Peta.buildMetadata=$META")
          fi
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" :app:assembleDebug

      - name: 整理 APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#apks[@]}）。"
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${apks[0]}"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-apk
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
